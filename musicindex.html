  <style>

<body>

<section id="musica">

  <!-- canciones -->
</section>

  <div class="song">

<footer>

<script>
  // Scroll suave a sección
  function scrollToSection(id) {
    const elem = document.getElementById(id);
    if (elem) {
      elem.scrollIntoView({ behavior: 'smooth' });
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const audios = document.querySelectorAll('audio');
    audios.forEach(audio => {
      audio.addEventListener('play', () => {
        audios.forEach(a => {
          if (a !== audio && !a.paused) {
            a.pause();
          }
        });
      });
    });
  });

  function likeSong(id) {
    const ref = db.ref('likes/' + id);
    ref.transaction(current => (current || 0) + 1);
  }

  function addComment(id) {
    const input = document.getElementById('comment-' + id);
    const text = input.value.trim();
    if (text !== "") {
      db.ref('comments/' + id).push({ text });
      input.value = "";
    }
  }

  function setupSong(id) {
    const likeEl = document.getElementById('likes-' + id);
    const commentList = document.getElementById('comments-' + id);

    db.ref('likes/' + id).on('value', snap => {
      likeEl.textContent = snap.val() || 0;
    });

    db.ref('comments/' + id).on('child_added', snap => {
      const li = document.createElement('li');
      li.textContent = snap.val().text;
      commentList.appendChild(li);
    });
  }

  ['amor-imperfecto', 'insomnio', 'ocaso', 'odiame', 'el-precio'].forEach(setupSong);

  function toggleSuscripcion() {
    if (localStorage.getItem("subscribed") === "true") {
      alert("Ya estás suscripto 🎧");
    } else {
      alert("¡Gracias por suscribirte! Te avisaremos cuando haya nuevos lanzamientos 🔔");
      localStorage.setItem("subscribed", "true");
    }
  }
</script>

<div id="loader">
  <div class="spinner"></div>
  <h2>Cargando música...</h2>
</div>

<style>
  body.fade-out {
    opacity: 0;
    transition: opacity 0.5s ease-in;
  }
  #loader {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: #000;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    transition: opacity 0.6s ease-out;
  }
  #loader h2 {
    color: gold;
    font-size: 2rem;
    margin-top: 20px;
  }
  .spinner {
    width: 60px;
    height: 60px;
    border: 5px solid #444;
    border-top: 5px solid gold;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>

<script>
  window.addEventListener("load", function () {
    const loader = document.getElementById("loader");
    loader.style.opacity = 0;
    setTimeout(() => loader.style.display = "none", 600);
  });

  document.addEventListener("DOMContentLoaded", function () {
    document.body.classList.remove("fade-out");
    const links = document.querySelectorAll("a[href], button[onclick]");
    links.forEach(link => {
      const isAnchor = link.tagName === "A" && link.getAttribute("href");
      const isButton = link.tagName === "BUTTON" && link.getAttribute("onclick");

      if (isAnchor && !link.getAttribute("href").startsWith("#") && !link.href.startsWith("mailto") && !link.href.startsWith("http")) {
        link.addEventListener("click", function (e) {
          e.preventDefault();
          document.body.classList.add("fade-out");
          setTimeout(() => {
            window.location.href = link.getAttribute("href");
          }, 300);
        });
      }
    });
  });

  // Aseguramos que el body tenga fade-out al inicio
  document.body.classList.add("fade-out");
</script>
