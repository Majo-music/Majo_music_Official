<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Majo_music | Inicio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <style>
    body.fade-out {
      opacity: 0;
      transition: opacity 0.5s ease-in;
    }
    body {
      font-family: "Times New Roman", serif;
      margin: 0;
      background: #000;
      color: white;
      transition: opacity 0.5s ease-out;
      text-align: center;
    }
    header {
      background: #111;
      padding: 20px;
    }
    nav a {
      color: white;
      margin: 0 20px;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      color: gold;
    }
    img {
      width: 180px;
      margin: 30px 0 10px;
    }
    h1 {
      color: gold;
      font-size: 2.5rem;
    }
    .socials {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
      margin-top: 40px;
    }
    .social {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .social i {
      font-size: 2rem;
      transition: transform 0.3s;
    }
    .social:hover i {
      transform: scale(1.2);
      color: gold;
    }
    footer {
      margin-top: 60px;
      padding: 30px;
      color: #bbb;
      font-size: 0.9rem;
    }
    #loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: #000;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.6s ease-out;
    }
    #loader h2 {
      color: gold;
      font-size: 2rem;
      margin-top: 20px;
    }
    .spinner {
      width: 60px;
      height: 60px;
      border: 5px solid #444;
      border-top: 5px solid gold;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="fade-out">

  <div id="loader">
    <div class="spinner"></div>
    <h2>Bienvenido a Majo_music</h2>
  </div>

  <header>
   <nav>
  <a href="index.html">Inicio</a>
  <a href="musicindex.html#musica">Música</a>
  </nav>
  </header>

  <main>
    <img src="assets/img/logo.png" alt="Logo" />
    <h1>Majo_music</h1>
    <p>Somos Dos amigos que les gusta hacer Canciones , Si te gusta alguna podes ayudarnos con tu like y con tu Suscripcion eso ayudaria mucho ❤</p>
    <div class="socials">
      <div class="social">
        <a href="https://www.instagram.com/joakojara_/" target="_blank"><i class="fab fa-instagram" style="color:#E1306C;"></i></a>
        <small>Joaquito</small>
      </div>
      <div class="social">
        <a href="https://www.instagram.com/mati_sanzana17/" target="_blank"><i class="fab fa-instagram" style="color:#E1306C;"></i></a>
        <small>Mati</small>
      </div>
      <div class="social">
        <a href="https://www.tiktok.com/@mati_y_el_joaquito" target="_blank"><i class="fab fa-tiktok" style="color:#69C9D0;"></i></a>
        <small>TikTok</small>
      </div>
      <div class="social">
        <a href="https://www.youtube.com/@Majo_oficiall" target="_blank"><i class="fab fa-youtube" style="color:#FF0000;"></i></a>
        <small>YouTube</small>
      </div>
      <div class="social">
        <a href="https://music.apple.com/ar/artist/majo-music/1828393024" target="_blank"><i class="fab fa-apple" style="color:#FA57C1;"></i></a>
        <small>Apple Music</small>
      </div>
      <div class="social">
        <a href="https://open.spotify.com/artist/1fpH1vBbBXy0Cr8sDNCsrB" target="_blank"><i class="fab fa-spotify" style="color:#1DB954;"></i></a>
        <small>Spotify</small>
      </div>
    </div>
  </main>

  <footer>
    © 2025 Majo_music. Todos los derechos reservados.
  </footer>

  <script>
    window.addEventListener("load", function () {
      const loader = document.getElementById("loader");
      loader.style.opacity = 0;
      setTimeout(() => loader.style.display = "none", 600);
    });

    document.addEventListener("DOMContentLoaded", function () {
      document.body.classList.remove("fade-out");
      const links = document.querySelectorAll("a[href]");
      links.forEach(link => {
        const url = link.getAttribute("href");
        if (!url.startsWith("#") && !url.startsWith("mailto:") && !url.startsWith("http")) {
          link.addEventListener("click", function (e) {
            e.preventDefault();
            document.body.classList.add("fade-out");
            setTimeout(() => {
              window.location.href = url;
            }, 300);
          });
        }
      });
    });
  </script>
</body>
</html>
